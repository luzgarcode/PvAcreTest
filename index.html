<style id="appstyle">
:root{
  --paper:#EDF0F2; --surface:#FFFFFF; --surface-2:#F6F8F9; --ink:#17212B; --ink-2:#4A5763; --line:#D3DAE0;
  --vis:#F5B700; --vis-ink:#17212B; --vis-soft:#FFF3C4; --blue:#1D4F7C; --blue-soft:#E3EDF6;
  --logo:var(--vis); --logo-ink:var(--vis-ink);
  --ok:#1E7B4F; --ok-soft:#DDF1E6; --nok:#B3261E; --nok-soft:#F8E0DE;
  --zone:rgba(29,79,124,.16); --zone-line:#1D4F7C; --zone-sel:rgba(245,183,0,.35);
  --r:6px; --font:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-c:"Barlow Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10161C; --surface:#18212A; --surface-2:#1F2A35; --ink:#E8EDF1; --ink-2:#A3B0BC; --line:#2F3C48;
    --vis:#F5B700; --vis-ink:#17212B; --vis-soft:#3A3113; --blue:#8DB9E4; --blue-soft:#1C3247;
    --ok:#5CC592; --ok-soft:#173828; --nok:#F08A83; --nok-soft:#3F1C1A;
    --zone:rgba(141,185,228,.2); --zone-line:#8DB9E4; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10161C; --surface:#18212A; --surface-2:#1F2A35; --ink:#E8EDF1; --ink-2:#A3B0BC; --line:#2F3C48;
  --vis:#F5B700; --vis-ink:#17212B; --vis-soft:#3A3113; --blue:#8DB9E4; --blue-soft:#1C3247;
  --ok:#5CC592; --ok-soft:#173828; --nok:#F08A83; --nok-soft:#3F1C1A;
  --zone:rgba(141,185,228,.2); --zone-line:#8DB9E4; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{ margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%; }
button,input,select,textarea{ font:inherit; color:inherit; }
img{ max-width:100%; }
:focus-visible{ outline:3px solid var(--vis); outline-offset:2px; }
.hidden{ display:none !important; }

/* top bar */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--ink); color:#fff; display:flex; align-items:center; gap:12px; padding:10px 16px; min-height:56px; }
:root[data-theme="dark"] .bar{ background:#0A0F14; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bar{ background:#0A0F14; } }
.mark{ display:flex; align-items:center; gap:10px; font-family:var(--font-c); font-weight:700; font-size:22px; letter-spacing:.2px; white-space:nowrap; }
.mark i{ width:26px; height:26px; background:var(--logo); border-radius:4px; position:relative; flex:none; }
.mark i::after{ content:""; position:absolute; left:7px; top:4px; width:8px; height:13px; border:solid var(--logo-ink); border-width:0 3.5px 3.5px 0; transform:rotate(45deg); }
.bar .sp{ flex:1; }
.bar .title{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.bar .save-state{ font-size:13px; color:#B9C4CE; white-space:nowrap; }

/* buttons */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r); padding:9px 14px; font-weight:600; cursor:pointer; min-height:42px; text-decoration:none; }
.btn:hover{ border-color:var(--ink-2); }
.btn.primary{ background:var(--vis); color:var(--vis-ink); border-color:var(--vis); }
.btn.primary:hover{ filter:brightness(.96); }
.btn.dark{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn.ghost{ background:transparent; border-color:transparent; }
.btn.danger{ color:var(--nok); }
.btn.sm{ min-height:34px; padding:5px 10px; font-size:14px; }
.bar .btn{ background:transparent; color:#fff; border-color:#3A4754; }
.bar .btn.primary{ background:var(--vis); color:var(--vis-ink); border-color:var(--vis); }
.btn svg{ width:18px; height:18px; flex:none; }

/* home */
.wrap{ max-width:980px; margin:0 auto; padding:24px 16px 80px; }
.hero{ display:grid; gap:10px; margin:8px 0 22px; }
.hero-badge{ display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:13px; letter-spacing:.03em; text-transform:uppercase; color:var(--blue); background:var(--blue-soft); border-radius:20px; padding:5px 12px 5px 8px; width:max-content; }
.hero-badge svg{ width:18px; height:18px; }
.hero h1{ font-family:var(--font-c); font-weight:700; font-size:clamp(30px,6vw,44px); line-height:1.06; margin:0; }
.hero p{ margin:0; color:var(--ink-2); max-width:62ch; }
.profcard{ display:flex; align-items:center; gap:14px; padding:14px 16px; margin:4px 0 18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); cursor:pointer; flex-wrap:wrap; }
.profcard button{ flex:none; }
.profcard:hover{ border-color:var(--ink-2); }
.profcard .avatar{ flex:none; width:46px; height:46px; border-radius:50%; background:var(--vis-soft); color:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; }
.profcard .avatar svg{ width:24px; height:24px; }
.profcard .main{ flex:1 1 160px; min-width:150px; }
.profcard .name{ font-weight:700; font-size:16px; }
.profcard .meta{ color:var(--ink-2); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stats{ display:flex; gap:10px; margin-bottom:8px; }
.stat{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; }
.stat b{ display:block; font-family:var(--font-c); font-size:26px; line-height:1; }
.stat span{ color:var(--ink-2); font-size:13px; }
.hide-sm{ }
@media (max-width:520px){ .hide-sm{ display:none; } }
.rolepill{ font-size:12px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:#B9C4CE; border:1px solid #3A4754; border-radius:20px; padding:3px 10px; }
.rolepill.admin{ color:var(--vis-ink); background:var(--vis); border-color:var(--vis); }
.rolepill.checking{ opacity:.7; }
.rolepill.err{ color:#F08A83; border-color:#F08A83; cursor:help; }
.rolepill{ white-space:nowrap; transition:opacity .6s ease; }
.rolepill.pill-out{ opacity:0; }
.mark span.brand-fade{ opacity:0; transition:opacity .6s ease; }
.mark span.brand-fade.brand-in{ opacity:1; }
.sec-h{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:28px 0 12px; }
.sec-h h2{ font-family:var(--font-c); font-size:24px; margin:0; flex:1; min-width:180px; }
.list{ display:grid; gap:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-top:1px solid var(--line); flex-wrap:wrap; }
.row:first-child{ border-top:0; }
.row .main{ flex:1; min-width:200px; }
.row .name{ font-weight:700; font-size:17px; }
.row .meta{ color:var(--ink-2); font-size:14px; }
.row .acts{ display:flex; gap:6px; flex-wrap:wrap; }
.doc-ico{ width:38px; height:46px; border:2px solid var(--ink); border-radius:3px; position:relative; flex:none; background:var(--surface-2); }
.doc-ico::before{ content:""; position:absolute; left:6px; right:6px; top:10px; height:2px; background:var(--ink-2); box-shadow:0 7px 0 var(--ink-2), 0 14px 0 var(--ink-2); }
.doc-ico.filled::after{ content:""; position:absolute; right:-6px; bottom:-6px; width:16px; height:16px; background:var(--vis); border-radius:50%; border:2px solid var(--surface); }
.client-row{ cursor:pointer; }
.client-row:hover{ background:var(--surface-2); }
.client-ico{ background:var(--blue-soft); color:var(--blue); border:none; display:flex; align-items:center; justify-content:center; font-family:var(--font-c); font-weight:700; font-size:16px; }
.client-ico-img{ background:#fff; border:1px solid var(--line, #e2e2e2); border-radius:8px; padding:4px; overflow:hidden; }
.client-ico-img::before{ content:none; }
.client-ico-img img{ width:100%; height:100%; object-fit:contain; }
.doc-ico-img{ background:#fff; overflow:hidden; }
.doc-ico-img::before{ content:none; }
.doc-ico-img img{ width:100%; height:100%; object-fit:cover; border-radius:1px; }
.chev{ flex:none; color:var(--ink-2); width:20px; height:20px; }
.searchwrap{ margin:0 0 22px; }
.row .title{}
.empty{ padding:22px 16px; color:var(--ink-2); }
.progress{ position:relative; height:18px; background:var(--surface-2); border-radius:9px; overflow:hidden; margin-top:6px; max-width:240px; }
.progress b{ display:block; height:100%; background:var(--ok); border-radius:9px; }
.progress-label{ position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--ink); }
.sent-badge{ color:var(--ok); font-weight:700; }
.sent-banner{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:var(--ok-soft); color:var(--ok); border-radius:var(--r); padding:10px 14px; font-weight:700; margin-bottom:12px; }
.archive-month{ margin-top:10px; }
.archive-month:first-child{ margin-top:0; }
.archive-month-h{ font-weight:700; font-size:13px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.02em; margin:0 0 6px 2px; }

/* editor */
.editor{ display:flex; flex-direction:column; height:calc(100vh - 56px); height:calc(100dvh - 56px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); }
.tools{ display:flex; gap:6px; padding:8px 12px; background:var(--surface); border-bottom:1px solid var(--line); overflow-x:auto; align-items:center; flex:none; }
.tool{ display:flex; flex-direction:column; align-items:center; gap:2px; min-width:64px; padding:6px 8px; border:1px solid transparent; border-radius:var(--r); background:transparent; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-2); }
.tool svg{ width:22px; height:22px; }
.tool:hover{ background:var(--surface-2); }
.tool.on{ background:var(--vis-soft); border-color:var(--vis); color:var(--ink); }
.tools .sep{ width:1px; align-self:stretch; background:var(--line); margin:0 4px; flex:none; }
.ed-body{ flex:1; display:flex; min-height:0; }
.ed-pages{ flex:1; overflow:auto; padding:16px; background:var(--paper); }
.ed-panel{ width:330px; flex:none; overflow:auto; background:var(--surface); border-left:1px solid var(--line); padding:16px; }
.pg-wrap{ margin:0 auto 22px; width:max-content; }
.pg-label{ font-size:13px; color:var(--ink-2); font-weight:600; margin-bottom:4px; }
.pg{ position:relative; background:#fff; box-shadow:0 1px 0 var(--line), 0 0 0 1px var(--line); }
.pg canvas{ display:block; width:100%; height:100%; }
.ov{ position:absolute; inset:0; touch-action:pan-x pan-y; }
.ov.creating{ cursor:crosshair; touch-action:none; }
.fz{ position:absolute; background:var(--zone); border:1.5px solid var(--zone-line); border-radius:2px; overflow:hidden; cursor:move; touch-action:none; }
.fz span{ position:absolute; left:2px; top:0; font-size:10px; line-height:1.2; color:var(--zone-line); font-weight:600; white-space:nowrap; pointer-events:none; }
.fz.sel{ background:var(--zone-sel); border-color:#C78F00; border-width:2px; z-index:3; overflow:visible; }
.fz.sibling{ background:rgba(245,183,0,.18); border-color:#C78F00; border-style:dashed; }
.fz .h{ position:absolute; right:-7px; bottom:-7px; width:14px; height:14px; background:var(--vis); border:2px solid var(--vis-ink); border-radius:50%; cursor:nwse-resize; display:none; }
.fz.sel .h{ display:block; }
.fz.draft{ background:var(--zone-sel); border:2px dashed #C78F00; }
.t-check,.t-optbox{ border-style:solid; }
.t-photo{ background:repeating-linear-gradient(45deg, var(--zone), var(--zone) 6px, transparent 6px, transparent 12px); }
.t-signature{ border-style:dotted; }

.panel h3{ font-family:var(--font-c); font-size:21px; margin:0 0 10px; }
.panel p.help{ color:var(--ink-2); font-size:14px; margin:0 0 12px; }
.fld{ display:grid; gap:4px; margin-bottom:12px; }
.fld > span{ font-size:13px; font-weight:600; color:var(--ink-2); }
.inp, .panel select, .panel textarea{ width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:8px 10px; min-height:40px; }
textarea.inp, .panel textarea{ min-height:84px; resize:vertical; }
.grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.grid4 input{ padding:6px; min-height:34px; font-size:14px; }
.btnrow{ display:flex; gap:6px; flex-wrap:wrap; }
.divider{ height:1px; background:var(--line); margin:16px 0; }
.chk{ display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0; }
.kbd{ font-size:12px; color:var(--ink-2); }
.gorder{ display:grid; gap:2px; }
.pubcard{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 16px; margin-bottom:12px; border:1.5px solid var(--vis); background:var(--vis-soft); border-radius:var(--r); }
.pubcard > div{ flex:1; min-width:220px; }
.pubcard .name{ font-weight:700; } .pubcard .meta{ font-size:14px; color:var(--ink-2); }
.gorow{ display:flex; align-items:center; gap:2px; padding:2px 0 2px 10px; border-radius:var(--r); background:var(--surface-2); }
.gorow span{ flex:1; font-size:14px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gorow .btn{ min-height:30px; padding:2px 10px; }
.busy .box{ background:var(--surface); color:var(--ink); border-radius:10px; padding:20px 22px; max-width:420px; display:grid; gap:14px; font-size:16px; font-weight:600; }
.busy.ctl::before{ display:none; }
.busy .box .ln{ display:flex; align-items:center; gap:12px; }
.busy .box .ln::before{ content:""; flex:none; width:20px; height:20px; border:3px solid var(--vis); border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
@media (prefers-reduced-motion: reduce){ .busy .box .ln::before{ animation:none; } }

/* fill */
.fill{ max-width:760px; margin:0 auto; padding:16px 12px 120px; }
.fill-head{ display:grid; gap:10px; margin:6px 0 16px; }
.fill-head .inp{ font-size:18px; font-weight:600; }
.fill-stats{ display:flex; align-items:center; gap:12px; color:var(--ink-2); font-size:14px; flex-wrap:wrap; }
.pbar{ position:relative; flex:1 1 160px; min-width:140px; height:30px; background:var(--surface-2); border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.pbar-fill{ position:absolute; inset:0; width:0%; background:var(--vis); border-radius:999px; transition:width .35s ease; }
.pbar-label{ position:relative; z-index:1; display:flex; align-items:center; justify-content:center; height:100%; font-weight:700; font-size:13px; color:var(--ink); }
.grp{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; }
.grp > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:14px 14px; font-weight:700; font-size:17px; }
.grp > summary::-webkit-details-marker{ display:none; }
.grp > summary::before{ content:""; width:9px; height:9px; border:solid var(--ink-2); border-width:0 2.5px 2.5px 0; transform:rotate(-45deg); transition:transform .15s; flex:none; margin-right:2px; }
.grp[open] > summary::before{ transform:rotate(45deg); }
.grp > summary .t{ flex:1; }
.cnt{ font-size:13px; font-weight:600; color:var(--ink-2); background:var(--surface-2); border-radius:20px; padding:2px 9px; white-space:nowrap; }
.cnt.done{ background:var(--ok-soft); color:var(--ok); }
.grp-body{ padding:4px 14px 14px; border-top:1px solid var(--line); }
.q{ padding:10px 0; border-bottom:1px dashed var(--line); }
.q:last-child{ border-bottom:0; }
.q > label, .q > .ql{ display:block; font-weight:600; font-size:15px; margin-bottom:6px; }
.q .inp{ font-size:16px; }
.mcdo-wrap{ position:relative; }
.mcdo-sugg{ position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:50; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 6px 18px rgba(0,0,0,.18); max-height:240px; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; touch-action:pan-y; box-sizing:border-box; }
.mcdo-sugg[hidden]{ display:none; }
.mcdo-sugg-item{ display:block; width:100%; box-sizing:border-box; text-align:left; background:none; border:0; border-bottom:1px dashed var(--line); padding:10px 12px; font:inherit; color:var(--ink); cursor:pointer; white-space:normal; overflow-wrap:anywhere; }
.mcdo-sugg-item:last-child{ border-bottom:0; }
.mcdo-sugg-item:hover, .mcdo-sugg-item:active{ background:var(--surface-2); }
.mcdo-sugg-item .num{ color:var(--ink-2); font-size:12px; margin-left:6px; }
.seg{ display:flex; flex-wrap:wrap; gap:6px; }
.seg button{ border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r); padding:8px 14px; min-height:42px; min-width:64px; font-weight:600; cursor:pointer; }
.seg button.on{ background:var(--blue); border-color:var(--blue); color:var(--surface); }
.seg button.on.v-ok{ background:var(--ok); border-color:var(--ok); }
.seg button.on.v-nok{ background:var(--nok); border-color:var(--nok); }
.seg button.on.v-warn{ background:var(--vis); border-color:var(--vis); color:var(--vis-ink); }
.toggle{ display:flex; align-items:center; gap:10px; cursor:pointer; font-weight:600; }
.toggle input{ width:24px; height:24px; accent-color:var(--blue); }
.media{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.media img{ max-height:120px; border:1px solid var(--line); border-radius:4px; background:#fff; }
.sig-prev{ max-height:70px !important; }
.annex-item{ display:grid; grid-template-columns:120px 1fr; gap:10px; align-items:start; padding:10px 0; border-bottom:1px dashed var(--line); }
.annex-item:last-child{ border-bottom:0; }
.annex-item .ph{ width:120px; height:90px; border:1.5px dashed var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); overflow:hidden; cursor:pointer; color:var(--ink-2); font-size:13px; text-align:center; }
.annex-item .ph img{ width:100%; height:100%; object-fit:cover; }
.dock{ position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line); padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; justify-content:center; }
.dock .btn{ flex:1; max-width:260px; }

/* modal */
.modal{ position:fixed; inset:0; z-index:50; background:rgba(10,15,20,.6); display:flex; align-items:center; justify-content:center; padding:12px; padding-top:calc(12px + env(safe-area-inset-top,0px)); padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); }
.sheet{ background:var(--surface); border-radius:10px; width:min(900px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden; }
.sheet-h{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); }
.sheet-h h3{ margin:0; flex:1; font-family:var(--font-c); font-size:22px; overflow-wrap:anywhere; min-width:0; }
.sheet-b{ overflow:auto; padding:14px; background:var(--paper); }
.sheet-f{ display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); justify-content:flex-end; flex-wrap:wrap; }
.prev-pg{ display:block; margin:0 auto 12px; max-width:100%; box-shadow:0 0 0 1px var(--line); background:#fff; }
.sig-pad{ width:100%; height:min(46vh,320px); background:#fff; border:1px solid var(--line); border-radius:6px; touch-action:none; display:block; }
.sig-line{ position:relative; }
.sig-line::after{ content:"Signez ici"; position:absolute; left:16px; right:16px; bottom:22%; border-top:1.5px dashed #9AA6B1; color:#9AA6B1; font-size:12px; padding-top:2px; pointer-events:none; }

.scanrow{ display:flex; gap:8px; align-items:center; }
.scanrow .inp{ flex:1; min-width:0; }

window.addEventListener("error", e => showFatalError(e.error || e.message));
window.addEventListener("unhandledrejection", e => showFatalError(e.reason));
function showFatalError(err){
  try{
    const msg = (err && err.message) ? (err.message + (err.stack ? "\n" + String(err.stack).split("\n").slice(0,5).join("\n") : "")) : String(err);
    let box = document.getElementById("fatalErrBox");
    if (!box){
      box = document.createElement("div");
      box.id = "fatalErrBox";
      box.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;background:#c0392b;color:#fff;font:11px/1.4 -apple-system,monospace;padding:10px;white-space:pre-wrap;z-index:999999;box-sizing:border-box";
      const label = document.createElement("div");
      label.textContent = "⚠️ Erreur technique (envoie une capture à Dylan) :";
      label.style.cssText = "font-weight:700;margin-bottom:6px";
      box.appendChild(label);
      document.documentElement.appendChild(box);
    }
    const line = document.createElement("div");
    line.textContent = msg;
    line.style.cssText = "margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.3)";
    box.appendChild(line);
  }catch(e){}
}

function b64ToBuf(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }
function bufToB64(buf){ const u = new Uint8Array(buf); let s=""; const CH=0x8000; for (let i=0;i<u.length;i+=CH) s += String.fromCharCode.apply(null, u.subarray(i,i+CH)); return btoa(s); }

/* ============ storage (IndexedDB, falls back to memory) ============ */
const Store = {
  db:null, mem:{templates:new Map(), drafts:new Map(), meta:new Map()}, persistent:true,
  async open(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("pv-terrain", 1);
        r.onupgradeneeded = () => { const d=r.result; d.createObjectStore("templates",{keyPath:"id"}); d.createObjectStore("drafts",{keyPath:"id"}); d.createObjectStore("meta",{keyPath:"k"}); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }catch(e){ this.persistent=false; this.db=null; }
  },
  _req(store, mode, fn){
    return new Promise((res, rej) => { const tx=this.db.transaction(store, mode); const r=fn(tx.objectStore(store)); tx.oncomplete=()=>res(r && r.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); });
  },
  async get(s,k){ if(!this.db) return clone2(this.mem[s].get(k)); return this._req(s,"readonly",st=>st.get(k)); },
  async put(s,v){ if(!this.db){ this.mem[s].set(v.id ?? v.k, v); return; } return this._req(s,"readwrite",st=>st.put(v)); },
  async del(s,k){ if(!this.db){ this.mem[s].delete(k); return; } return this._req(s,"readwrite",st=>st.delete(k)); },
  async all(s){ if(!this.db) return [...this.mem[s].values()]; return this._req(s,"readonly",st=>st.getAll()); },
};
function clone2(v){ return v; }

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdf.worker.min.js";
const pdfCache = new Map();
async function loadPdfJs(tpl){
  const key = tpl.id + ":" + (tpl.pdfVersion||0);
  if (pdfCache.has(key)) return pdfCache.get(key);
  const p = pdfjsLib.getDocument({data:new Uint8Array(tpl.pdf.slice(0)), isEvalSupported:false}).promise;
  pdfCache.set(key, p); return p;
}
async function pageSizes(pdf){

}

let MCDO_NAME_TO_NUM = null;
function normMcdoName(s){
  return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/-/g," ").toLowerCase().replace(/\s+/g," ").trim();
}
/* Les noms de la liste embarquée viennent de l'URL du site McDo (tirets partout, y
   compris entre des mots qui n'en ont pas dans un nom de ville normal). On les affiche
   et on les remplit avec des espaces à la place, plus lisible sur un PV. */
function mcdoDisplayName(raw){
  return String(raw||"").replace(/-/g," ");
}
async function loadMcdoRestaurants(){
  try{
    const res = await fetch("./assets/mcdo-restaurants.json");
    if (res.ok){
      MCDO_RESTAURANTS = await res.json();
      MCDO_NAME_TO_NUM = {};
      for (const num in MCDO_RESTAURANTS){
        const key = normMcdoName(MCDO_RESTAURANTS[num]);
        if (key && !(key in MCDO_NAME_TO_NUM)) MCDO_NAME_TO_NUM[key] = num;
      }
      const dl = document.getElementById("mcdoNamesList");
      if (dl){
        const names = Object.values(MCDO_RESTAURANTS).map(mcdoDisplayName).sort((a,b)=>a.localeCompare(b,"fr"));
        dl.innerHTML = names.map(n=>`<option value="${esc(n)}">`).join("");
      }
    }
  }catch(e){}
}
/* Suggestions de noms McDo (autocomplétion maison, ne dépend pas du <datalist> natif — peu fiable sur iOS Safari) */
function mcdoMatches(query){
  if (!MCDO_RESTAURANTS) return [];
  const key = normMcdoName(query);
  if (key.length < 2) return [];
  const starts = [], contains = [];
  const seen = new Set();
  for (const num in MCDO_RESTAURANTS){
    const name = MCDO_RESTAURANTS[num];
    const nkey = normMcdoName(name);
    if (!nkey || seen.has(nkey)) continue;
    if (nkey.startsWith(key)){ starts.push(name); seen.add(nkey); }
    else if (nkey.includes(key)){ contains.push(name); seen.add(nkey); }
  }
  const cmp = (a,b)=>a.localeCompare(b,"fr");
  return starts.sort(cmp).concat(contains.sort(cmp)).slice(0,8);
}
function renderMcdoSuggest(fid, query){
  const box = document.getElementById("sugg_"+fid); if (!box) return;
  const matches = mcdoMatches(query);
  if (!matches.length){ box.hidden = true; box.innerHTML=""; return; }
  box.innerHTML = matches.map(n=>{ const d=mcdoDisplayName(n); return `<button type="button" class="mcdo-sugg-item" data-mcdopick="${esc(fid)}" data-mcdoval="${esc(d)}">${esc(d)}</button>`; }).join("");
  box.hidden = false;
}
function hideMcdoSuggest(fid){
  const box = document.getElementById("sugg_"+fid); if (box){ box.hidden = true; box.innerHTML=""; }

async function saveFile(filename, bytes, mime, text, shareTitle){
  const blob = new Blob([bytes], {type:mime});
  let file = null;
  try{ file = new File([blob], filename, {type:mime}); }catch(e){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ const payload = {files:[file], title:shareTitle||filename}; if (text) payload.text = text; await navigator.share(payload); return "shared"; }
    catch(e){ if (e && e.name === "AbortError") return "aborted"; }
  }
  const url = URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 8000);
  return "downloaded";
}

async function exportBackup(){
  const [drafts, profile] = await Promise.all([Store.all("drafts"), getProfile()]);
  const payload = {app:"pv-go-backup", version:1, exportedAt:Date.now(), profile, drafts};
  const stamp = new Date().toISOString().slice(0,10);
  const result = await saveFile(`pv-go-sauvegarde-${stamp}.json`, JSON.stringify(payload), "application/json");
  if (result==="shared") toast("Sauvegarde exportée");
  else if (result==="downloaded") toast("Sauvegarde téléchargée");
}
async function importBackupFile(file){
  let payload;
  try{ payload = JSON.parse(await file.text()); }
  catch(e){ alert("Ce fichier n'est pas une sauvegarde valide."); return; }
  if (!payload || !Array.isArray(payload.drafts)){ alert("Ce fichier n'est pas une sauvegarde valide."); return; }
  const n = payload.drafts.length;
  if (!confirm(`Importer ${n} rapport${n>1?"s":""} depuis cette sauvegarde ?\n\nUn rapport déjà présent sur cet appareil avec le même identifiant sera remplacé par celui de la sauvegarde.`)) return;
  for (const d of payload.drafts) await Store.put("drafts", d);
  if (payload.profile && confirm("Restaurer aussi le profil technicien (nom, téléphone, email, secteur, signature) de cette sauvegarde ?\n\nIl remplacera le profil actuel de cet appareil.")){
    await saveProfile(payload.profile);
  }
  toast(`${n} rapport${n>1?"s":""} importé${n>1?"s":""}`);
  showSettings();
}

/* ============ SYNCHRONISATION DES MODÈLES ============ */
async function fetchJson(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }
async function fetchBuf(url){ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status); return r.arrayBuffer(); }
async function syncManifest(){
  S.syncing = true;
  let manifest; let failures = 0;
  try{
    manifest = await fetchJson("./models/manifest.json?t=" + Date.now());
  }catch(e){
    S.syncing = false; console.error("syncManifest (manifest)", e);
    return {ok:false, error:(e&&e.message)||String(e)};
  }
  S.manifestIndex = new Map(manifest.map(t => [t.id, t.updatedAt||0]));
  for (const m of manifest){
    try{
      const cur = await Store.get("templates", m.id);
      if (cur && (cur.updatedAt||0) >= (m.updatedAt||0)) continue;
      const [meta, pdf] = await Promise.all([
        fetchJson(`./models/${m.id}/meta.json?v=${m.updatedAt||0}`),
        fetchBuf(`./models/${m.id}/${m.id}.pdf?v=${m.updatedAt||0}`)
      ]);
      const clientsArr = Array.isArray(meta.clients) ? meta.clients : (meta.client ? [meta.client] : []);
      await Store.put("templates", {id:m.id, name:meta.name, shortName:meta.shortName||"", fields:meta.fields, annexPhotos:meta.annexPhotos||[], optionalPages:meta.optionalPages||[], clients:clientsArr, category:meta.category||"Autre", pdf, createdAt:(cur&&cur.createdAt)||Date.now(), updatedAt:m.updatedAt||0, published:true});
    }catch(e){
      // One template failing to fetch (flaky connection) must never block the others,
      // nor block cleanup below — it's simply retried on the next sync.
      failures++; console.error("syncManifest (template "+m.id+")", e);
    }
  }
  try{
    for (const t of await Store.all("templates")) if (t.published && !S.manifestIndex.has(t.id)) await Store.del("templates", t.id);
  }catch(e){ console.error("syncManifest (cleanup)", e); }
  S.syncing = false;
  await Store.put("meta", {k:"lastSync", v:Date.now()});
  return failures ? {ok:false, error:`${failures} modèle${failures>1?"s":""} non synchronisé${failures>1?"s":""} (réessaiera automatiquement)`} : {ok:true};
}

/* ============ HOME ============ */
function setBar(html){ bar.innerHTML = html; }
async function syncPill(){
  const last = await Store.get("meta","lastSync");
  if (S.syncing) return `<span class="rolepill checking">Vérification des mises à jour…</span>`;
  if (S.syncError) return `<span class="rolepill err" title="${esc(S.syncError)}">Mise à jour impossible</span>`;
  if (!last) return "";
  const mins = Math.round((Date.now()-last.v)/60000);
  const txt = mins < 2 ? "à jour à l'instant" : mins < 60 ? `à jour il y a ${mins} min` : `à jour depuis le ${fmtDate(last.v)}`;
  return `<span class="rolepill" title="Les modèles sont vérifiés à chaque ouverture">${esc(txt)}</span>`;
}
let brandFadeTimer = null;
async function homeBar(){
  if (brandFadeTimer){ clearTimeout(brandFadeTimer); brandFadeTimer = null; }
  setBar(`<div class="mark"><i></i><span class="brand-fade">${esc(APP_NAME)}</span></div>${await syncPill()}<div class="sp"></div>${IS_TEST_BUILD?`<button class="btn sm" id="barLogout" aria-label="Se déconnecter">${ICON.logout||""}<span class="hide-sm">Déconnexion</span></button>`:""}<button class="btn sm" id="barProfile" aria-label="Mon profil">${ICON.user}<span class="hide-sm">Mon profil</span></button>`);
  if (IS_TEST_BUILD) $("#barLogout").onclick = logout;
  // Sur mobile, l'icône seule reste dans la barre ; une fois la synchro confirmée
  // (pas d'erreur, pas en cours), le pill "à jour…" laisse place au nom de l'appli
  // après quelques secondes. En cas d'échec/hors-ligne, le pill d'état reste affiché.
  if (!S.syncing && !S.syncError){
    brandFadeTimer = setTimeout(() => {
      const pill = bar.querySelector(".rolepill");
      const span = bar.querySelector(".mark span");
      if (pill) pill.classList.add("pill-out");
      if (span){ span.style.display = "inline-block"; requestAnimationFrame(() => span.classList.add("brand-in")); }
      if (pill) setTimeout(() => { if (pill.isConnected) pill.style.display = "none"; }, 650);
    }, 3500);
  }
}

/* ============ ARCHIVE DES RAPPORTS ENVOYÉS ============ */
function monthLabel(ts){
  const s = new Date(ts).toLocaleDateString("fr-FR", {month:"long", year:"numeric"});
  return s.charAt(0).toUpperCase() + s.slice(1);
}
// regroupe les rapports envoyés par client (McDo/BK/etc., comme sur l'accueil) puis par mois,
// du plus récent au plus ancien ; un modèle supprimé entre-temps tombe dans son propre groupe
function groupSentDrafts(drafts, tpls){
  const byClient = new Map();
  for (const d of drafts){
    const tpl = tpls.find(t=>t.id===d.templateId);
    const client = tpl ? (tplClients(tpl)[0] || "Tous clients") : "Modèle supprimé";
    if (!byClient.has(client)) byClient.set(client, new Map());
    const monthMap = byClient.get(client);
    const dt = new Date(d.sentAt);
    const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`;
    if (!monthMap.has(key)) monthMap.set(key, {label: monthLabel(d.sentAt), items: []});
    monthMap.get(key).items.push(d);
  }
  for (const monthMap of byClient.values()) for (const bucket of monthMap.values()) bucket.items.sort((a,b)=>b.sentAt-a.sentAt);
  return byClient;
}
function archiveRowsHtml(items, tplName){
  return items.map(d => `<div class="row"><div class="doc-ico filled"></div><div class="main"><div class="name">${esc(d.name)}</div><div class="meta">${esc(tplName(d.templateId))} · <span class="sent-badge">✓ Envoyé le ${fmtDate(d.sentAt)}</span></div></div>
    <div class="acts"><button class="btn primary" data-open-draft="${d.id}">Reprendre</button><button class="btn sm ghost" data-unsend-draft="${d.id}">Remettre en cours</button><button class="btn sm danger ghost" data-del-draft="${d.id}">Supprimer</button></div></div>`).join("");
}
async function showArchive(){
  S.view = "archive";
  const [tpls, allDrafts] = await Promise.all([Store.all("templates"), Store.all("drafts")]);
  const sent = allDrafts.filter(d=>d.sentAt);
  const tplName = id => (tpls.find(t=>t.id===id)||{}).name || "Modèle supprimé";
  setBar(`<button class="btn sm" id="bk" aria-label="Retour">${ICON.back}</button><div class="title">Rapports envoyés</div><div class="sp"></div>`);
  $("#bk").onclick = () => showProfile();
  const byClient = groupSentDrafts(sent, tpls);
  const clientKeys = [...byClient.keys()].sort((a,b)=> a==="Modèle supprimé" ? 1 : b==="Modèle supprimé" ? -1 : a.localeCompare(b,"fr"));
  main.innerHTML = `<div class="wrap">
    ${sent.length ? clientKeys.map(client => {
      const monthMap = byClient.get(client);
      const monthEntries = [...monthMap.entries()].sort((a,b)=>b[0].localeCompare(a[0]));
      const total = [...monthMap.values()].reduce((s,b)=>s+b.items.length,0);
      return `<details class="grp" style="margin-bottom:14px"><summary>${clientIconHtml(client)}<span class="t">${esc(client)} (${total})</span></summary>
        <div class="grp-body">${monthEntries.map(([key,bucket]) => `<div class="archive-month"><div class="archive-month-h">${esc(bucket.label)}</div>
          <div class="list">${archiveRowsHtml(bucket.items, tplName)}</div></div>`).join("")}</div></details>`;
    }).join("") : `<div class="empty">Aucun rapport envoyé pour l'instant.</div>`}
  </div>`;
  $$("[data-open-draft]").forEach(b => b.onclick = () => openFill(b.dataset.openDraft));
  $$("[data-del-draft]").forEach(b => b.onclick = async () => {
    const d = await Store.get("drafts", b.dataset.delDraft);
    if (!d || !confirm(`Supprimer le rapport « ${d.name} » ?`)) return;
    await Store.del("drafts", d.id); showArchive();
  });
  $$("[data-unsend-draft]").forEach(b => b.onclick = async () => {
    const d = await Store.get("drafts", b.dataset.unsendDraft);
    if (!d) return;
    delete d.sentAt; await Store.put("drafts", d);
    toast("Remis dans les rapports en cours"); showArchive();
  });
}

function applyProfileToDraft(tpl, draft, profile){
  if (!profileFilled(profile) && !profile.signature) return;
  for (const f of tpl.fields){
    if (!f.auto) continue;
    if (f.auto==="tech-name" && profile.name) draft.values[f.id] = profile.name;
    else if (f.auto==="tech-phone" && profile.phone) draft.values[f.id] = profile.phone;
    else if (f.auto==="tech-email" && profile.email) draft.values[f.id] = profile.email;
    else if (f.auto==="tech-signature" && profile.signature) draft.values[f.id] = profile.signature;
  }
}

/* ============ FILL ============ */
const gName = f => f.group || ("Page " + (f.page+1));
// formOrder (optionnel, par champ) permet de forcer l'ordre d'affichage dans le formulaire
// sans changer page/x/y (qui restent utilisés pour le placement réel sur le PDF).
function fieldCmp(a, b){
  const ah = typeof a.formOrder === "number", bh = typeof b.formOrder === "number";
  if (ah && bh && a.formOrder !== b.formOrder) return a.formOrder - b.formOrder;
  if (ah !== bh) return ah ? -1 : 1;
  return a.page-b.page || a.y-b.y || a.x-b.x;
}
function defaultGroupOrder(tpl){
  const sorted = tpl.fields.map((f,i)=>({f,i})).sort((a,b)=> a.f.page-b.f.page || a.f.y-b.f.y || a.f.x-b.f.x || a.i-b.i).map(x=>x.f);
  const L = [...new Set(sorted.map(gName))];
  const sig = new Set(tpl.fields.filter(f=>f.type==="signature").map(gName));
  const key = g => g.replace(/\d+/g, "#");
  const nums = g => (g.match(/\d+/g)||[]).map(Number);
  const cmp = (a,b) => { const x=nums(a), y=nums(b); for (let i=0;i<Math.max(x.length,y.length);i++){ if (x[i]!==y[i]) return (x[i]??-1)-(y[i]??-1); } return 0; };
  const emit = list => { const out=[], done=new Set(); for (const g of list){ const k=key(g); if (done.has(k)) continue; done.add(k); out.push(...list.filter(h=>key(h)===k).sort(cmp)); } return out; };
  return [...emit(L.filter(g=>!sig.has(g))), ...emit(L.filter(g=>sig.has(g)))];
}
function groupOrder(tpl){
  const def = defaultGroupOrder(tpl);
  if (!Array.isArray(tpl.groupOrder) || !tpl.groupOrder.length) return def;
  const set = new Set(def); const custom = tpl.groupOrder.filter(g=>set.has(g));
  return [...custom, ...def.filter(g=>!custom.includes(g))];
}
function orderedGroups(tpl){
  const sorted = tpl.fields.map((f,i)=>({f,i})).sort((a,b)=> a.f.page-b.f.page || a.f.y-b.f.y || a.f.x-b.f.x || a.i-b.i).map(x=>x.f);
  const groups = new Map(groupOrder(tpl).map(g=>[g,[]]));
  for (const f of sorted) groups.get(gName(f)).push(f);
  // si des champs d'un groupe portent un formOrder explicite, on l'utilise pour l'ordre d'affichage
  // (uniquement au sein du groupe ; la position réelle sur le PDF n'est pas affectée)
  for (const fs of groups.values()) if (fs.some(f=>typeof f.formOrder==="number")) fs.sort(fieldCmp);
  return groups;
}
const isFilled = v => v!==undefined && v!==null && v!=="" && v!==false;
// les champs "mirror" (valeur recopiée d'un autre champ, ex. le type NGK/SAT choisi
// dans le Matériel, réaffiché dans la checklist Installation) ne sont jamais
// remplis pour eux-mêmes : ils ne comptent pas dans les zones à remplir
function countableFields(tpl){ return tpl ? tpl.fields.filter(f=>f.type!=="mirror") : []; }
function countFilled(d, tpl){ if(!tpl) return 0; return countableFields(tpl).filter(f=>isFilled(d.values[f.id])).length; }
// un champ avec visibleIf ne s'affiche dans le formulaire que si le champ qu'il
// référence a déjà la valeur attendue (ex. une checklist "ORB Comptoir" qui ne
// s'affiche que si "ORB - Comptoir" a été répondu "OUI" dans le Matériel)
function isFieldVisible(f, values){
  if (!f.visibleIf) return true;
  const v = values[f.visibleIf.field];
  return f.visibleIf.equalsAny ? f.visibleIf.equalsAny.includes(v) : v===f.visibleIf.equals;
}
function visibleGroups(tpl, values){
  const groups = orderedGroups(tpl);
  const out = new Map();
  for (const [g, fs] of groups){
    const vis = fs.filter(f=>f.type!=="mirror" && isFieldVisible(f, values));
    if (vis.length) out.set(g, vis);
  }
  return out;
}

function groupHtml(g, fs, gi){
  const hasChoice = fs.some(f=>f.type==="choice");
  return `<details class="grp" data-g="${esc(g)}" ${gi===0?"open":""}><summary><span class="t">${esc(g)}</span><span class="cnt" data-cnt></span></summary>

    ${fs.map(f=>fieldHtml(f)).join("")}</div></details>`;
}
function allFirstLabel(fs){
  /* "OK" (s'il y a des contrôles) + l'option par défaut du champ "Type de borne" (s'il y en a un) */
  const choiceFields = fs.filter(f=>f.type==="choice");
  const labels = [];
  const okLabel = choiceFields.map(f=>(f.options[0]||{}).label).find(l=>/^(ok|oui)$/i.test(l||""));
  if (okLabel) labels.push(okLabel);
  const typeF = choiceFields.find(f=>/type de borne/i.test(f.label||""));
  const extra = typeF ? (typeF.options[0]||{}).label : null;
  if (extra && extra!==okLabel && !labels.includes(extra)) labels.push(extra);
  if (!labels.length){
    const first = choiceFields[0];
    if (first) labels.push((first.options[0]||{}).label);
  }
  return labels.length ? `Tout à ${labels.join(" & ")} (cases vides)` : "Tout remplir (cases vides)";
}
function isSerialField(f){ return f.type==="text" && /s[ée]rie|serial/i.test(f.label||""); }
function borneNum(label){ const m = /borne\b[\s\S]*?(\d+)\s*(?:[–-]|$)/i.exec(label||""); return m ? m[1] : null; }
function activeBornes(tpl, values){
  // Detects a per-borne info section (fields whose label names a borne number, outside choice checklists).
  // Returns {borneNum:true,...} for bornes that have at least one filled info field, or null if this template has no such concept (no restriction).
  let hasInfo = false; const info = {};
  tpl.fields.forEach(f=>{
    if (f.type==="choice") return;
    const n = borneNum(f.label); if(!n) return;
    hasInfo = true;
    if (isFilled(values[f.id])) info[n] = true;
  });
  return hasInfo ? info : null;
}

  return `<div class="q" data-q="${f.id}">${f.type==="check"?`<div class="ql">${esc(f.label)}</div>${w}`:lab+w}</div>`;
}

function setVal(fid, v, opts){
  const auto = !!(opts && opts.auto);
  if(isFilled(v)) S.draft.values[fid]=v; else delete S.draft.values[fid];
  if (!S.draft.autoFields) S.draft.autoFields = {};
  if (auto) S.draft.autoFields[fid] = true; else delete S.draft.autoFields[fid];
  draftChanged();
  /* Numéro de site McDo -> déduit l'adresse mail (<numéro sur 4 chiffres>@net.mcdonalds.fr) */
  const f = S.tpl && S.tpl.fields.find(x=>x.id===fid);
  if (f && f.auto==="site-number"){
    const emailF = S.tpl.fields.find(x=>x.auto==="site-email-mcdo");
    if (emailF){
      const already = S.draft.values[emailF.id];
      const wasAuto = S.draft.autoFields[emailF.id];
      if (!isFilled(already) || wasAuto){
        const digits = String(v||"").replace(/\D/g,"");
        const num = digits ? digits.padStart(4,"0") : "";
        setVal(emailF.id, num ? `${num}@net.mcdonalds.fr` : "", {auto:true});
        refreshField(emailF.id);
      }
    }
    /* Même numéro -> déduit le nom du restaurant (McDo uniquement, via la liste embarquée) */
    if (emailF && MCDO_RESTAURANTS){
      const nameF = S.tpl.fields.find(x=>x.auto==="site-client");
      if (nameF){
        const already = S.draft.values[nameF.id];
        const wasAuto = S.draft.autoFields[nameF.id];
        if (!isFilled(already) || wasAuto){
          const digits = String(v||"").replace(/\D/g,"").replace(/^0+/,"");
          const name = digits ? MCDO_RESTAURANTS[digits] : null;
          setVal(nameF.id, name ? mcdoDisplayName(name) : "", {auto:true});
          refreshField(nameF.id);
        }
      }
    }
    /* Même numéro -> déduit le téléphone du restaurant (McDo uniquement, via la liste embarquée) */
    if (emailF && MCDO_PHONES){
      const phoneF = S.tpl.fields.find(x=>x.auto==="site-phone-mcdo");
      if (phoneF){
        const already = S.draft.values[phoneF.id];
        const wasAuto = S.draft.autoFields[phoneF.id];
        if (!isFilled(already) || wasAuto){
          const digits = String(v||"").replace(/\D/g,"").replace(/^0+/,"");
          const tel = digits ? MCDO_PHONES[digits] : null;
          setVal(phoneF.id, tel ? formatFrPhone(tel) : "", {auto:true});
          refreshField(phoneF.id);
        }
      }
    }
    /* Même numéro -> déduit l'adresse du restaurant (McDo uniquement, via la liste embarquée).
       Pas conditionné à la présence d'un champ email-mcdo : certains PV McDo (Dashboard, Double
       Check) n'ont pas de champ email mais ont un champ Adresse.
       Quand le modèle a des champs CP / Ville séparés (ex. Remodel/Ouverture, Drive Coates), on
       découpe la chaîne d'adresse embarquée (qui se termine toujours par "<code postal> <ville>")
       pour ne mettre que la rue dans "Adresse" et remplir CP/Ville à part, plutôt que de tout
       dupliquer dans un seul champ. */
    if (MCDO_ADDRESSES){
      const addrF = S.tpl.fields.find(x=>x.auto==="site-address-mcdo");
      const cpF = S.tpl.fields.find(x=>x.auto==="site-cp-mcdo");
      const villeF = S.tpl.fields.find(x=>x.auto==="site-ville-mcdo");
      if (addrF){
        const already = S.draft.values[addrF.id];
        const wasAuto = S.draft.autoFields[addrF.id];
        if (!isFilled(already) || wasAuto){
          const digits = String(v||"").replace(/\D/g,"").replace(/^0+/,"");
          const address = digits ? MCDO_ADDRESSES[digits] : null;
          if ((cpF || villeF) && address){
            const m = address.match(/^(.*?),?\s*(\d{5})\s+(.+)$/);
            setVal(addrF.id, m ? m[1] : address, {auto:true});
            refreshField(addrF.id);
            if (cpF){ setVal(cpF.id, m ? m[2] : "", {auto:true}); refreshField(cpF.id); }
            if (villeF){ setVal(villeF.id, m ? m[3] : "", {auto:true}); refreshField(villeF.id); }
          } else {
            setVal(addrF.id, address || "", {auto:true});
            refreshField(addrF.id);
            if (cpF){ setVal(cpF.id, "", {auto:true}); refreshField(cpF.id); }
            if (villeF){ setVal(villeF.id, "", {auto:true}); refreshField(villeF.id); }
          }
        }
      }
    }
  }
  /* Nom de restaurant McDo choisi/tapé (via l'autosuggestion) -> déduit le numéro (et en cascade l'email) */
  if (f && f.auto==="site-client" && !auto && MCDO_NAME_TO_NUM && S.tpl.fields.some(x=>x.auto==="site-email-mcdo")){
    const numF = S.tpl.fields.find(x=>x.auto==="site-number");
    if (numF){
      const key = normMcdoName(v);
      const num = key ? MCDO_NAME_TO_NUM[key] : null;
      if (num){
        const already = S.draft.values[numF.id];
        const wasAuto = S.draft.autoFields[numF.id];
        if (!isFilled(already) || wasAuto){
          setVal(numF.id, num, {auto:true});
          refreshField(numF.id);
        }
      }
    }
  }
  /* Numéro de site Quick -> déduit l'adresse du restaurant (via la liste embarquée) */
  if (f && f.auto==="site-number-quick" && QUICK_RESTAURANTS){
    const addrF = S.tpl.fields.find(x=>x.auto==="site-address-quick");

        const info = digits ? QUICK_RESTAURANTS[digits] : null;
        const address = info ? `Quick ${info.name} — ${info.address}, ${info.zip} ${info.city}` : "";
        setVal(addrF.id, address, {auto:true});
        refreshField(addrF.id);
      }
    }
  }
}

async function fileToJpeg(file, max=1600, q=0.82){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { URL.revokeObjectURL(url); }
}

/* ---- signature pad ---- */
function signaturePad(title, ratio){
  return new Promise(resolve => {
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Signature"><div class="sheet-h"><h3>${esc(title)}</h3></div>
      <div class="sheet-b"><div class="sig-line"><canvas class="sig-pad"></canvas></div></div>
      <div class="sheet-f"><button class="btn ghost" data-x="clear">Effacer</button><span style="flex:1"></span><button class="btn" data-x="cancel">Annuler</button><button class="btn primary" data-x="ok">Valider la signature</button></div></div>`;
    document.body.appendChild(m);
    const c=$("canvas",m); const dpr=Math.max(1,window.devicePixelRatio||1);
    const fit=()=>{ const r=c.getBoundingClientRect(); c.width=r.width*dpr; c.height=r.height*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr); x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#0F2A5C"; x.lineWidth=2.4; };
    requestAnimationFrame(fit);
    let drawing=false, last=null, inked=false;
    const pos=e=>{ const r=c.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
    c.onpointerdown=e=>{ drawing=true; last=pos(e); c.setPointerCapture(e.pointerId); const x=c.getContext("2d"); x.beginPath(); x.arc(last.x,last.y,1.2,0,7); x.fillStyle="#0F2A5C"; x.fill(); inked=true; };
    c.onpointermove=e=>{ if(!drawing) return; const p=pos(e); const x=c.getContext("2d"); x.beginPath(); x.moveTo(last.x,last.y); x.lineTo(p.x,p.y); x.stroke(); last=p; inked=true; };
    c.onpointerup=c.onpointercancel=()=>{ drawing=false; };
    const close=v=>{ m.remove(); resolve(v); };
    m.onclick=e=>{ const a=e.target.dataset && e.target.dataset.x; if(!a) return;
      if(a==="clear"){ c.getContext("2d").clearRect(0,0,c.width,c.height); inked=false; }
      if(a==="cancel") close(null);
      if(a==="ok"){ if(!inked){ close(null); return; } close(trimCanvas(c)); } };
  });
}
function trimCanvas(c){
  const x=c.getContext("2d"); const {width:w,height:h}=c; const d=x.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++) for(let i=0;i<w;i++){ if(d[(y*w+i)*4+3]>10){ if(i<x0)x0=i; if(i>x1)x1=i; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if (x1<x0) return null;
  const pad=6; x0=Math.max(0,x0-pad); y0=Math.max(0,y0-pad); x1=Math.min(w-1,x1+pad); y1=Math.min(h-1,y1+pad);
  const o=document.createElement("canvas"); o.width=x1-x0+1; o.height=y1-y0+1; o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL("image/png");
}

function barcodeSupported(){ return !!(window.ZXingBrowser && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
function scanBarcode(){
  return new Promise(resolve => {
    if (!barcodeSupported()){ toast("Scanner indisponible sur cet appareil"); resolve(null); return; }
    const m=document.createElement("div"); m.className="modal scan-modal";
    m.innerHTML=`<div class="sheet scan-sheet" role="dialog" aria-modal="true" aria-label="Scanner un code-barres">
      <div class="sheet-h"><h3 style="font-size:18px">Scanner un code-barres</h3><button class="btn sm ghost" data-x="cancel" aria-label="Fermer">✕</button></div>
      <div class="sheet-b scan-body">
        <div class="scan-frame"><video class="scan-video" playsinline muted autoplay></video><div class="scan-guide"></div><button type="button" class="scan-torch" data-x="torch" aria-label="Activer le flash" hidden>${ICON.flash}</button></div>
        <p class="kbd scan-msg" id="scanMsg">Visez le code-barres avec la caméra… touchez l'image pour faire la mise au point.</p>
      </div>
      <div class="sheet-f"><button class="btn" data-x="cancel">Annuler</button></div></div>`;
    document.body.appendChild(m);
    const video=$("video",m), msg=$("#scanMsg",m), torchBtn=$(".scan-torch",m), frame=$(".scan-frame",m);
    let controls=null, done=false, torchOn=false, torchBusy=false;
    const close=v=>{ if(done) return; done=true; try{ controls && controls.stop(); }catch(e){} m.remove(); resolve(v); };
    let reader;
    try{ reader = new ZXingBrowser.BrowserMultiFormatReader(); }
    catch(e){ toast("Scanner indisponible sur cet appareil"); m.remove(); resolve(null); return; }
    reader.decodeFromVideoDevice(undefined, video, (result) => { if (result && !done) close(result.getText()); })
      .then(c => {

          const caps = c.streamVideoCapabilitiesGet && c.streamVideoCapabilitiesGet();

        }catch(e){}
      })
      .catch(e => { msg.textContent = e && e.name==="NotAllowedError" ? "Accès à la caméra refusé." : e && e.name==="NotFoundError" ? "Aucune caméra détectée sur cet appareil." : "Impossible d'ouvrir la caméra."; });
    const focusRing = (x,y) => { const r=document.createElement("div"); r.className="scan-focus-ring"; r.style.left=x+"px"; r.style.top=y+"px"; frame.appendChild(r); setTimeout(()=>r.remove(), 650); };
    frame.addEventListener("click", e => {
      if (e.target.closest(".scan-torch")) return;

      focusRing(e.clientX-rect.left, e.clientY-rect.top);
      if (!controls || !controls.streamVideoConstraintsApply) return;
      const x=(e.clientX-rect.left)/rect.width, y=(e.clientY-rect.top)/rect.height;
      try{
        const p = controls.streamVideoConstraintsApply({ advanced:[{ pointsOfInterest:[{x,y}], focusMode:"single-shot" }] });
        if (p && p.catch) p.catch(() => {
          try{ const p2=controls.streamVideoConstraintsApply({ advanced:[{ focusMode:"single-shot" }] }); if (p2 && p2.catch) p2.catch(()=>{}); }catch(e2){}
        });
      }catch(err){}
    });
    m.onclick=e=>{ const a=e.target.dataset && (e.target.dataset.x || e.target.closest("[data-x]")?.dataset.x); if(!a) return;
      if(a==="cancel") close(null);
      if(a==="torch"){
        if (!controls || !controls.switchTorch || torchBusy) return;
        torchBusy=true; const next=!torchOn;
        controls.switchTorch(next).then(()=>{ torchOn=next; torchBtn.classList.toggle("on", torchOn); }).catch(()=>{}).finally(()=>{ torchBusy=false; });
      }
    };
  });
}

/* ============ PDF GENERATION ============ */
const INK = () => PDFLib.rgb(0.06, 0.17, 0.42);
function makeSafe(font){
  const cache=new Map();
  // \n et \r doivent traverser tels quels : ce ne sont pas des glyphes \u00e0 dessiner
  // (wrapLines() les utilise ensuite pour couper le texte en paragraphes), donc on
  // ne les fait pas passer par font.encodeText() qui les remplacerait par "?".
  return s => { let out=""; for (const ch of String(s)){ if(ch==="\n"||ch==="\r"){ out+=ch; continue; } if(!cache.has(ch)){ let ok=true; try{ font.encodeText(ch); }catch(e){ ok=false; } cache.set(ch,ok); } out += cache.get(ch) ? ch : (ch==="\u2713"?"v":"?"); } return out; };
}
function wrapLines(text, font, size, maxW){
  const out=[];
  for (const para of String(text).split(/\r?\n/)){
    const words = para.split(/\s+/).filter(w=>w.length); if(!words.length){ out.push(""); continue; }
    let line="";
    for (const w of words){
      const t = line ? line+" "+w : w;
      if (font.widthOfTextAtSize(t,size) <= maxW || !line){
        if (!line && font.widthOfTextAtSize(w,size) > maxW){ // break very long word
          let chunk=""; for (const ch of w){ if(font.widthOfTextAtSize(chunk+ch,size)>maxW && chunk){ out.push(chunk); chunk=ch; } else chunk+=ch; } line=chunk; continue;
        }
        line=t;
      } else { out.push(line); line=w; }
    }
    out.push(line);
  }
  return out;
}
function displayValue(f, v){
  if (f.type==="date" && /^\d{4}-\d{2}-\d{2}$/.test(v)){ const [y,m,d]=v.split("-"); return `${d}/${m}/${y}`; }
  if (f.type==="time") return String(v).replace(":", "h");
  return String(v);
}
function drawMark(page, r, kind){
  const s=Math.min(r.w,r.h,13); const cx=r.x+r.w/2, cy=r.y+r.h/2; const k=s*0.36; const th=Math.max(0.9, s*0.09);
  const c=INK();
  if (kind==="check"){ page.drawLine({start:{x:cx-k,y:cy},end:{x:cx-k*0.25,y:cy-k*0.8},thickness:th,color:c}); page.drawLine({start:{x:cx-k*0.25,y:cy-k*0.8},end:{x:cx+k,y:cy+k*0.9},thickness:th,color:c}); }
  else if (kind==="strike"){ const th2=Math.max(1,r.h*0.11); page.drawLine({start:{x:r.x+r.w*0.03,y:cy},end:{x:r.x+r.w*0.97,y:cy},thickness:th2,color:c}); }
  else { page.drawLine({start:{x:cx-k,y:cy-k},end:{x:cx+k,y:cy+k},thickness:th,color:c}); page.drawLine({start:{x:cx-k,y:cy+k},end:{x:cx+k,y:cy-k},thickness:th,color:c}); }
}
async function buildPdf(tpl, draft){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(tpl.pdf.slice(0), {ignoreEncryption:true});
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const safe = makeSafe(font), safeB = makeSafe(bold);
  const pages = doc.getPages();
  const toPdf = (page, r) => { const cb=page.getCropBox(); return {x:cb.x+r.x, y:cb.y+cb.height-r.y-r.h, w:r.w, h:r.h}; };
  const imgCache = new Map();
  const embed = async d => { if(imgCache.has(d)) return imgCache.get(d); const bytes=dataUrlToBytes(d); const im = d.startsWith("data:image/png") ? await doc.embedPng(bytes) : await doc.embedJpg(bytes); imgCache.set(d,im); return im; };
  for (const f of tpl.fields){
    // un champ "mirror" n'a pas sa propre valeur : il réaffiche celle d'un autre
    // champ du modèle (ex. le type NGK/SAT choisi dans le Matériel, recopié dans
    // l'en-tête de la checklist Installation correspondante)
    let v = draft.values[f.id];
    if (f.type==="mirror"){ const src=tpl.fields.find(x=>x.id===f.source); v = src ? draft.values[src.id] : undefined; }
    if(!isFilled(v)) continue;
    const page = pages[f.page]; if(!page) continue;
    if (f.type==="check"){ drawMark(page, toPdf(page,f), f.mark); continue; }
    if (f.type==="choice" && f.choiceMode==="boxes"){ const o=f.strikeOpposite ? f.options.find(o=>o.label!==v) : f.options.find(o=>o.label===v); if(o && o.box){ const pg=pages[o.box.page ?? f.page]; drawMark(pg, toPdf(pg,o.box), f.mark); } continue; }
    if (f.type==="choice" && f.choiceMode==="color"){
      const o = f.options.find(o=>o.label===v);
      if (o && o.color){
        const r=toPdf(page,f); const hex=o.color.replace("#",""); const cr=parseInt(hex.slice(0,2),16)/255, cg=parseInt(hex.slice(2,4),16)/255, cb=parseInt(hex.slice(4,6),16)/255;
        page.drawRectangle({x:r.x,y:r.y,width:r.w,height:r.h,color:rgb(cr,cg,cb)});
        // le libellé (OK/NOK/En cours/N/A) est redessiné par-dessus la pastille,
        // sauf quand le champ force fontSize:0 (pastille volontairement trop
        // étroite pour du texte, ex. le suivi Turn Over) ; couleur du texte
        // choisie selon le contraste de la couleur de fond
        if (f.fontSize !== 0){
          const lum = 0.299*cr*255 + 0.587*cg*255 + 0.114*cb*255;
          const txtColor = lum < 150 ? rgb(1,1,1) : rgb(0,0,0);
          const label = safeB(v); const pad=3;
          let size = Math.min(f.fontSize || 9.5, Math.max(6, r.h*0.68));
          while (bold.widthOfTextAtSize(label,size) > r.w-2*pad && size>5) size -= 0.25;
          const tw = bold.widthOfTextAtSize(label,size);
          page.drawText(label, {x:r.x+(r.w-tw)/2, y:r.y+(r.h-size*0.72)/2, size, font:bold, color:txtColor});
        }
      }
      continue;
    }
    const r = toPdf(page, f);
    if (f.eraseBg) page.drawRectangle({x:r.x, y:r.y, width:r.w, height:r.h, color:rgb(1,1,1)});
    if (f.type==="photo" || f.type==="signature"){
      const im = await embed(v); const s=Math.min(r.w/im.width, r.h/im.height); const w=im.width*s, h=im.height*s;
      page.drawImage(im, {x:r.x+(r.w-w)/2, y:r.y+(r.h-h)/2, width:w, height:h}); continue;
    }
    const text = safe(displayValue(f, v)); const pad=1.5;
    if (f.type==="multiline"){
      const size0 = f.fontSize || Math.min(10, Math.max(6, r.h*0.7));
      const fits = (n, lh, sz) => (n-1)*lh + sz <= r.h - pad;
      let size=size0, lines=null, lh=0;
      if (f.lineHeight){ for (size=size0; size>=6; size-=0.5){ lines=wrapLines(text, font, size, r.w-2*pad); lh=f.lineHeight; if (fits(lines.length, lh, size)) break; } }
      if (!lines || !fits(lines.length, lh, size)){ for (size=size0; ; size-=0.5){ lines=wrapLines(text, font, size, r.w-2*pad); lh=size*1.18; if (fits(lines.length, lh, size) || size<=5) break; } }
      let y = r.y + r.h - pad - size*0.88;
      for (const ln of lines){ if (y < r.y - size*0.2) break; const tw=font.widthOfTextAtSize(ln,size); const x = f.align==="center" ? r.x+(r.w-tw)/2 : r.x+pad; page.drawText(ln,{x,y,size,font,color:INK()}); y -= lh; }
    } else {
      let size = f.fontSize || Math.min(f.type==="choice" ? 9.5 : 11, Math.max(6, r.h*0.72));
      const oneLine = text.replace(/\s*\n\s*/g," ");
      while (font.widthOfTextAtSize(oneLine,size) > r.w-2*pad && size>5) size-=0.25;
      const tw=font.widthOfTextAtSize(oneLine,size);
      const x = f.align==="center" ? r.x+(r.w-tw)/2 : r.x+pad;
      const y = r.y + (r.h - size*0.72)/2;
      page.drawText(oneLine,{x,y,size,font,color:INK()});
    }
  }
  // annex photos — une page pleine par photo, pour garder le détail
  const photos = draft.annex.filter(a=>a.photo);
  if (photos.length){
    const W=595.28, H=841.89, M=40;
    for (let i=0;i<photos.length;i++){
      const pg = doc.addPage([W,H]);
      pg.drawRectangle({x:0,y:H-46,width:W,height:46,color:rgb(0.09,0.13,0.17)});
      pg.drawText(safeB("Photos jointes au PV"),{x:M,y:H-29,size:13,font:bold,color:rgb(1,1,1)});
      const sub = safe(draft.name||""); let ss=9; while(font.widthOfTextAtSize(sub,ss)>W-2*M-150 && ss>6) ss-=0.5;
      pg.drawText(sub,{x:W-M-font.widthOfTextAtSize(sub,ss),y:H-29,size:ss,font,color:rgb(0.8,0.84,0.88)});
      const a = photos[i];
      const capH = 30, top = H-46-16, boxH = top-M-capH;
      const im=await embed(a.photo); const s=Math.min((W-2*M)/im.width, boxH/im.height); const w=im.width*s, h=im.height*s;
      pg.drawImage(im,{x:(W-w)/2, y:M+capH+(boxH-h)/2, width:w, height:h});
      const cap = safe(`${i+1}. ${a.caption||"Photo"}`);
      let cs=12; while(bold.widthOfTextAtSize(cap,cs)>W-2*M && cs>7) cs-=0.5;
      pg.drawText(cap,{x:M,y:M+(capH-cs)/2,size:cs,font:bold,color:rgb(0.09,0.13,0.17)});
    }
  }
  // fichiers PDF joints — pages ajoutées telles quelles, à la fin, avec une légende sur la 1ère page
  for (const a of (draft.annexFiles||[])){
    if (!a.bytes) continue;
    try{
      const src = await PDFDocument.load(a.bytes, {ignoreEncryption:true});
      const copied = await doc.copyPages(src, src.getPageIndices());
      copied.forEach((p,idx) => {
        doc.addPage(p);
        if (idx===0 && a.caption){
          const pw=p.getWidth(), ph=p.getHeight(), bh=Math.min(30, Math.max(16, ph*0.1));
          p.drawRectangle({x:0,y:ph-bh,width:pw,height:bh,color:rgb(0.09,0.13,0.17)});
          const cap = safeB(a.caption);
          let cs = Math.min(11, bh*0.45);
          while (bold.widthOfTextAtSize(cap,cs) > pw-16 && cs>6) cs -= 0.25;
          p.drawText(cap, {x:8, y:ph-bh+(bh-cs)/2, size:cs, font:bold, color:rgb(1,1,1)});
        }
      });
    }catch(e){ console.error("annexFile", a.name, e); }
  }
  try{ const form = doc.getForm(); for (const ff of form.getFields()) form.removeField(ff); }catch(e){}
  const opt = (tpl.optionalPages||[]).filter(i => i < pages.length && !tpl.fields.some(f => isFilled(draft.values[f.id]) && (f.page===i || (f.options||[]).some(o => o.box && o.box.page===i && draft.values[f.id]===o.label))));
  opt.sort((x,y)=>y-x).forEach(i => doc.removePage(i));
  doc.setTitle(draft.name||tpl.name); doc.setProducer("PV & Go"); doc.setCreator("PV & Go");
  return doc.save();
}
function siteTokens(){
  const tpl = S.tpl, draft = S.draft;
  const valOf = role => { const f = tpl.fields.find(f => f.auto === role); if (!f) return ""; const v = draft.values[f.id]; return (typeof v === "string" && v.trim()) ? v.trim() : ""; };

}
function pdfFileName(){

function locFor(tpl){ const {client, number} = siteTokens(); return [client, number ? "n°"+number : ""].filter(Boolean).join(" "); }

/* "shared" = la feuille de partage du téléphone a transmis le PDF à l'appli choisie avec succès
   (SMS, mail, WhatsApp…) — c'est le seul signal que le web donne ; il n'y a aucun moyen de savoir
   si la personne a ensuite vraiment appuyé sur "Envoyer" dans cette appli. */
async function applySendOutcome(outcome){
  if (!outcome) return;
  if (outcome.action==="send" && outcome.result==="shared"){
    S.draft.sentAt = Date.now();

  } else if (outcome.action==="send" && outcome.result==="downloaded"){

    toast("PDF sauvegardé");
  }
}

async function openCalibrate(tpl){
  if (!tpl) return;
  const pdf = await pdfjsLib.getDocument({data: tpl.pdf.slice(0), isEvalSupported:false}).promise;
  const pages = [...new Set(tpl.fields.map(f=>f.page))].sort((a,b)=>a-b);
  if (!pages.length){ alert("Ce modèle n'a aucun champ à calibrer."); return; }
  let pageIdx = 0;
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Calibrage" style="width:min(1100px,100%)">
    <div class="sheet-h"><h3>🛠 Calibrer — ${esc(tpl.name)}</h3><button class="btn sm" data-x="close">Fermer</button></div>
    <div class="sheet-f" style="border-bottom:1px solid var(--line);border-top:none;justify-content:space-between">
      <div class="btnrow"><button class="btn sm" data-x="prev">◀ Page</button><span id="calLbl" class="kbd"></span><button class="btn sm" data-x="next">Page ▶</button></div>
      <div class="btnrow"><button class="btn sm" data-x="copy">Copier le JSON</button></div>
    </div>
    <div class="sheet-b" id="calBody" style="position:relative;overflow:auto;-webkit-user-select:none;user-select:none;touch-action:none;"></div>
  </div>`;
  document.body.appendChild(m);
  const body = $("#calBody", m);

  async function render(){
    const p = pages[pageIdx];
    $("#calLbl", m).textContent = `Page ${p+1} (${pageIdx+1}/${pages.length})`;
    const pg = await pdf.getPage(p+1);
    const v1 = pg.getViewport({scale:1});
    const wAvail = Math.max(320, Math.min(1060, body.clientWidth || 1000));
    const scale = wAvail / v1.width;
    const vp = pg.getViewport({scale});
    body.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.style.cssText = `position:relative;width:${vp.width}px;height:${vp.height}px;margin:0 auto;`;
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height; canvas.style.display="block";
    await pg.render({canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
    wrap.appendChild(canvas);
    body.appendChild(wrap);
    for (const f of tpl.fields.filter(f=>f.page===p)) mkBox(wrap, f, scale);
  }

  function mkBox(wrap, f, scale){
    const box = document.createElement("div");
    box.style.cssText = `position:absolute;left:${f.x*scale}px;top:${f.y*scale}px;width:${f.w*scale}px;height:${f.h*scale}px;border:1.5px solid #e6522f;background:rgba(230,82,47,.14);cursor:move;font-size:9px;line-height:1.1;color:#c73f1e;overflow:hidden;box-sizing:border-box;padding:1px;font-family:var(--font);`;
    box.textContent = f.label;
    const handle = document.createElement("div");
    handle.style.cssText = "position:absolute;right:-5px;bottom:-5px;width:13px;height:13px;background:#e6522f;border:1.5px solid #fff;border-radius:3px;cursor:nwse-resize;";
    box.appendChild(handle);
    wrap.appendChild(box);
    let mode=null, sx=0, sy=0, ox=0, oy=0, ow=0, oh=0;
    const ptOf = e => e.touches ? e.touches[0] : e;
    function start(md){ return e => {
      mode=md; e.stopPropagation(); e.preventDefault();
      const pt=ptOf(e); sx=pt.clientX; sy=pt.clientY; ox=f.x; oy=f.y; ow=f.w; oh=f.h;
      window.addEventListener("mousemove", move); window.addEventListener("mouseup", stop);
      window.addEventListener("touchmove", move, {passive:false}); window.addEventListener("touchend", stop);
    };}

      else { f.w=Math.max(8,Math.round(ow+dx)); f.h=Math.max(6,Math.round(oh+dy)); }
      box.style.left=(f.x*scale)+"px"; box.style.top=(f.y*scale)+"px";

  await render();

    const a = e.target.dataset && e.target.dataset.x;
    if (a==="close") m.remove();
    if (a==="prev"){ pageIdx=(pageIdx-1+pages.length)%pages.length; await render(); }
    if (a==="next"){ pageIdx=(pageIdx+1)%pages.length; await render(); }
    if (a==="copy"){
      const out = JSON.stringify(tpl.fields.map(f=>({id:f.id,page:f.page,x:f.x,y:f.y,w:f.w,h:f.h,label:f.label})), null, 2);
      try{ await navigator.clipboard.writeText(out); alert("Positions copiées — colle-les moi dans le chat pour que je les intègre."); }
      catch(err){ prompt("Copie ce texte et colle-le moi :", out); }
    }
  };
}

async function previewPdf(){
  await flushDraft();
  const done=busy("Création de l'aperçu…"); let bytes;
  try{ bytes = await buildPdf(S.tpl, S.draft); }catch(e){ done(); alert("Le PDF n'a pas pu être créé : "+(e.message||e)); return; }
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Aperçu"><div class="sheet-h"><h3>Aperçu</h3><button class="btn sm" data-x="close">Fermer</button></div><div class="sheet-b" id="pv"></div><div class="sheet-f"><button class="btn" data-x="close">Continuer à remplir</button><button class="btn primary" data-x="dl">Terminé</button></div></div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ const a=e.target.dataset && e.target.dataset.x; if(a==="close") m.remove(); if(a==="dl"){ m.remove(); showSendReview(bytes).then(applySendOutcome); } };
  try{
    const pdf = await pdfjsLib.getDocument({data:bytes.slice(0), isEvalSupported:false}).promise; done();
    const host=$("#pv",m); const wAvail=Math.min(860, host.clientWidth-28);
    for (let i=1;i<=pdf.numPages;i++){
      if(!m.isConnected) break;
      const pg=await pdf.getPage(i); const v1=pg.getViewport({scale:1}); const sc=wAvail/v1.width; const dpr=Math.min(2,window.devicePixelRatio||1);
      const vp=pg.getViewport({scale:sc*dpr}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; c.className="prev-pg"; c.style.width=(vp.width/dpr)+"px";
      host.appendChild(c); await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }
  }catch(e){ done(); }
}

/* ============ accès (mot de passe local) ============ */
const AUTH_PASSWORD = "AcreTech";
const AUTH_KEY = "pvgo_auth_ok";
const AUTH_AT_KEY = "pvgo_auth_at";
const AUTH_MAX_AGE = 30*24*60*60*1000; // 30 jours
function isAuthed(){
  try{
    if (localStorage.getItem(AUTH_KEY) !== "1") return false;
    const at = parseInt(localStorage.getItem(AUTH_AT_KEY)||"0", 10);
    const expired = at && (Date.now() - at > AUTH_MAX_AGE);
    // on ne redemande le mot de passe que si l'utilisateur est en ligne :
    // hors-ligne, on ne veut jamais bloquer un technicien sur le terrain.
    if (expired && navigator.onLine) return false;
    return true;
  }catch(e){ return false; }
}
function setAuthed(){ try{ localStorage.setItem(AUTH_KEY,"1"); localStorage.setItem(AUTH_AT_KEY, String(Date.now())); }catch(e){} }
function logout(){
  if (!confirm("Se déconnecter ? Le mot de passe sera redemandé au prochain accès.")) return;
  try{ localStorage.removeItem(AUTH_KEY); localStorage.removeItem(AUTH_AT_KEY); }catch(e){}
  location.reload();
}

  const overlay = document.createElement("div");
  overlay.id = "loginOverlay";

      <button class="btn primary" id="loginBtn">Accéder à l'application</button>
    </div>
    <p class="kbd" style="margin-top:16px">En cas de besoin du mot de passe, demander à vos collègues techniciens ou à Dylan Lagneau</p>
    <p class="kbd" style="margin-top:10px;font-size:11px">© 2026 Dylan Lagneau – Crimson Compass Soft. Tous droits réservés.</p>`;
  document.body.appendChild(overlay);

/* ---- diagnostic hors-ligne (visible dans Réglages → Dépannage) ---- */
const DIAG_KEY = "pvgo_diag";
async function runOfflineDiagnostic(){
  const lines = [];
  lines.push("Date : " + new Date().toLocaleString("fr-FR"));
  lines.push("En ligne : " + (navigator.onLine ? "oui" : "non"));
  lines.push("URL : " + location.href);
  try{
    if (!("serviceWorker" in navigator)){
      lines.push("Service worker : NON SUPPORTÉ par ce navigateur.");
    } else {
      try{
        const reg = await navigator.serviceWorker.register("./sw.js");
        const state = reg.active ? "active" : reg.installing ? "en cours d'installation" : reg.waiting ? "en attente" : "enregistré (état inconnu)";
        lines.push("Service worker : OK — " + state + (reg.active ? " (scope: " + reg.scope + ")" : ""));
        lines.push("Contrôle cette page : " + (navigator.serviceWorker.controller ? "oui" : "non — normal juste après l'installation, redemande après avoir rouvert l'appli"));
      }catch(err){
        lines.push("Service worker : ÉCHEC D'ENREGISTREMENT — " + (err && err.message ? err.message : String(err)));
      }
    }
    if (!("caches" in window)){
      lines.push("Cache API : NON SUPPORTÉE par ce navigateur.");
    } else {
      const keys = await caches.keys();
      if (!keys.length){
        lines.push("Caches : aucun (rien n'est encore mis de côté pour le hors-ligne).");
      } else {
        for (const k of keys){
          const c = await caches.open(k);
          const n = (await c.keys()).length;
          lines.push("Cache « " + k + " » : " + n + " fichier(s).");
        }
      }
    }
  }catch(e){
    lines.push("Erreur pendant le diagnostic : " + (e && e.message ? e.message : String(e)));
  }
  try{ localStorage.setItem(DIAG_KEY, lines.join("\n")); }catch(e){}
  return lines.join("\n");
}
